[package]
name = "fusebox"
version = "0.15.0"
edition = "2024"
rust-version = "1.88"
description = "One fast binary that turns your Claude, ChatGPT, Gemini, Antigravity, Grok, Kimi, Meta, Devin and Vertex accounts into OpenAI, Anthropic and Gemini compatible APIs."
license = "MIT"
repository = "https://github.com/DigitalPals/Fusebox"
homepage = "https://github.com/DigitalPals/Fusebox"
keywords = ["llm", "proxy", "claude", "openai", "gemini"]
categories = ["command-line-utilities", "web-programming::http-server"]
readme = "README.md"

[dependencies]
anyhow = "1"
arc-swap = "1"
async-compression = { version = "0.4", features = ["tokio", "gzip", "zstd"] }
async-stream = "0.3"
# Axum's defaults minus `form`, `matched-path` and `original-uri`, which nothing reads.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tower-log", "tracing", "ws", "macros", "multipart"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
base64 = "0.22"
bcrypt = "0.19"
bytes = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup", "functions", "hooks"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
fs2 = "0.4"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
hex = "0.4"
# The tz database, bundled as compact TZif data (see src/zone.rs).
jiff = { version = "0.2.39", default-features = false, features = ["std", "tzdb-bundle-always"] }
http-body-util = "0.1"
open = "5"
parking_lot = "0.12"
rand = "0.9"
ring = "0.17"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip", "zstd", "deflate", "socks", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
# `full` without processes and stdio, which nothing uses (axum-server still turns on `fs`).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "parking_lot"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip"] }
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"
zstd = "0.14.3"
yaml-edit = { version = "0.3.2", default-features = false }
yaml-rust2 = { version = "0.13.0", default-features = false }

[build-dependencies]
flate2 = "1"
sha2 = "0.10"

[dev-dependencies]
proptest = "1.12.0"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3

# Optional size-first build; keep normal releases optimized for runtime speed.
[profile.compact]
inherits = "release"
opt-level = "z"
