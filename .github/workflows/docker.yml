name: Docker

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/digitalpals/fusebox

# Replace superseded main builds; every tag or other dispatch has its own group.
concurrency:
  group: fusebox-docker-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && 'latest' || github.run_id }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The default image (root, CLIProxyAPI's layout), then the nonroot one; the
      # second reuses the first's build stage from the cache.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: default
          build-args: FUSEBOX_COMMIT=${{ github.sha }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - id: nonroot
        uses: docker/build-push-action@v6
        with:
          context: .
          target: nonroot
          build-args: FUSEBOX_COMMIT=${{ github.sha }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
      - name: Export digests
        run: |
          mkdir -p /tmp/digests/default /tmp/digests/nonroot
          for flavor in default nonroot; do
            if [ "$flavor" = default ]; then digest="${{ steps.build.outputs.digest }}"; else digest="${{ steps.nonroot.outputs.digest }}"; fi
            touch "/tmp/digests/$flavor/${digest#sha256:}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [default, nonroot]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # type=semver also adds latest, for stable versions only (not vX.Y.Z-rc.N).
          # The nonroot image gets the same tags with -nonroot (latest-nonroot, ...).
          flavor: |
            suffix=${{ matrix.flavor == 'nonroot' && '-nonroot' || '' }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
      - name: Create the multi-arch manifest
        working-directory: /tmp/digests/${{ matrix.flavor }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.description=All your AI subscriptions as one fast API. Drop-in for CLIProxyAPI." \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
