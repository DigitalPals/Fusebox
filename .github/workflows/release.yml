name: Release

# Pushing a vX.Y.Z tag (vX.Y.Z-rc.N for a prerelease) that matches the version
# in Cargo.toml builds every target and publishes the release. Notes in
# .github/release-notes/vX.Y.Z.md go above the generated list of changes.
on:
  push:
    tags: ["v*"]
  # Releases a tag that is already pushed, building its source with this
  # workflow, for when the workflow at the tag is what failed.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, such as v0.4.0
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  version:
    name: tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [[ "v$version" != "$TAG" ]]; then
            echo "::error::Tag $TAG doesn't match version $version in Cargo.toml"
            exit 1
          fi

  build:
    name: ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        # Linux builds use Debian 12, as the Docker image does, so they run on
        # glibc 2.36 rather than needing the runner's newer one.
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, container: "rust:1-bookworm" }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, container: "rust:1-bookworm" }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "x86_64-unknown-linux-gnu" ]]; then
            cargo rustc --release --locked --bin fusebox --target ${{ matrix.target }} -- \
              -C link-arg=-Wl,-z,pack-relative-relocs -C link-arg=-Wl,--icf=all
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
      - name: Check Linux release
        if: contains(matrix.target, 'linux-gnu')
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/fusebox"
          "$binary" --version
          if [[ "${{ matrix.target }}" == "x86_64-unknown-linux-gnu" ]]; then
            readelf --dynamic "$binary" | grep -E '\(RELR(SZ|ENT)?\)'
            readelf --version-info "$binary" | grep GLIBC_ABI_DT_RELR
          fi
          # The newest glibc symbol it uses, or 2.36 if it packs relocations.
          glibc=$(objdump -T "$binary" | grep -o 'GLIBC_[0-9][0-9.]*' | cut -d_ -f2 | sort -uV | tail -n1)
          if readelf --version-info "$binary" | grep GLIBC_ABI_DT_RELR > /dev/null; then
            glibc=$(printf '%s\n' "$glibc" 2.36 | sort -V | tail -n1)
          fi
          echo "${{ matrix.target }} needs glibc $glibc or newer" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Package
        shell: bash
        run: |
          name="fusebox-${TAG}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE "$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/fusebox.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
          else
            cp "target/${{ matrix.target }}/release/fusebox" "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            fusebox-*.tar.gz
            fusebox-*.zip
          if-no-files-found: error
          compression-level: 0

  # One job creates the release, so its notes are generated once.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum fusebox-* | tee SHA256SUMS
      - uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$TAG"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            exit 0
          fi
          args=(--verify-tag --title "Fusebox $tag" --generate-notes)
          # Release candidates use the notes of the release they lead up to.
          notes=".github/release-notes/${tag%%-*}.md"
          if [[ -f "$notes" ]]; then
            args+=(--notes-file "$notes")
          fi
          # List the changes since the stable release before this tag.
          previous=$({ git tag --list 'v*' | grep -v -e -; echo "$tag"; } | sort -uV | grep -B1 -x -e "$tag" | head -n1)
          if [[ "$previous" != "$tag" ]]; then
            args+=(--notes-start-tag "$previous")
          fi
          if [[ "$tag" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$tag" "${args[@]}" dist/*
