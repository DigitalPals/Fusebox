name: Client compatibility

# Daily reports; one quiet, consolidated compatibility review each Monday.
on:
  schedule:
    - cron: "17 6 * * 0,2-6"
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      update_issues:
        description: Reconcile the weekly review issue and retire legacy version alerts
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: client-compatibility
  cancel-in-progress: false

# Linux x64 jobs of trusted events run on ephemeral Beast VMs (DigitalPals/ci-platform
# github-runners): push, workflow_dispatch, schedule and same-repository pull requests.
# Fork pull requests, and everything while the BEAST_RUNNERS variable
# is "off" use GitHub-hosted runners. The Beast job hook rejects any other event too.
jobs:
  check:
    runs-on: ${{ vars.BEAST_RUNNERS != 'off' && (contains(fromJSON('["push","workflow_dispatch","schedule"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","beast-fusebox"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check upstream client compatibility reviews
        run: |
          if [ "$UPDATE_ISSUES" = "true" ]; then
            python3 .github/scripts/client_versions.py --update-issues
          else
            python3 .github/scripts/client_versions.py
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_ISSUES: ${{ (github.event_name == 'workflow_dispatch' && inputs.update_issues) || github.event.schedule == '17 6 * * 1' }}
